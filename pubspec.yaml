name: sirjoe_player
description: SirJoe Player - lettore musicale semplice e completo con Bluetooth automatico.
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.1.11
  media_kit_libs_audio: ^1.0.5
  audio_metadata_reader: ^1.4.0
  audio_service: ^0.18.15
  file_picker: ^8.1.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  image_path: "assets/icon.png"
  android: true
  ios: false
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon.png"

flutter:
  uses-material-design: true
